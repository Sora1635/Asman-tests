<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая платформа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </header>

    <div class="container">
        <div class="page active" id="home">
            <h1>Пройди увлекательные тесты!</h1>
            <p>Проверь свои знания и узнай свой результат!</p>
            <div class="home-buttons">
                <button class="action-btn" onclick="goToTests()"><i class="fas fa-play"></i> Тесты</button>
            </div>
        </div>

        <div class="page" id="take">
            <h1>Выбери тест</h1>
            <div class="test-list"></div>
            <div class="test-content" style="display: none;">
                <div class="timer"></div>
                <div class="question-number"></div>
                <div class="question"></div>
                <div class="navigation">
                    <button onclick="prevQuestion()" class="nav-btn"><i class="fas fa-arrow-left"></i> Назад</button>
                    <button onclick="nextQuestion()" class="nav-btn"><i class="fas fa-arrow-right"></i> Вперед</button>
                </div>
                <button id="save-answer" onclick="saveAnswer()">Сохранить ответ</button>
            </div>
        </div>
    </div>

    <script>
        let serverTests = [];
        let currentTest = null;
        let currentQuestion = 0;
        let timer = null;
        let answers = []; // Массив для хранения ответов
        let score = 0;
        let totalQuestions = 0;

        // Настройки
        const allowSkipQuestions = true; // Разрешить переход без ответа
        const allowOverwriteAnswers = false; // Разрешить пересохранение ответов

        // Переключение темы
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.querySelector('header').classList.toggle('dark');
            document.querySelectorAll('.card').forEach(card => card.classList.toggle('dark'));
            const toggle = document.querySelector('.theme-toggle i');
            toggle.classList.toggle('fa-moon');
            toggle.classList.toggle('fa-sun');
        }

        // Переход к тестам
        function goToTests() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('take').classList.add('active');
            loadTests();
        }

        // Загрузка тестов
        async function loadTests() {
            try {
                const response = await fetch('tests.json');
                serverTests = await response.json();
                renderTestList();
            } catch (e) {
                console.error('Ошибка загрузки тестов:', e);
            }
        }

        // Рендеринг списка тестов
        function renderTestList() {
            const testList = document.querySelector('.test-list');
            testList.innerHTML = '';
            serverTests.forEach((test, index) => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item card';
                testItem.innerHTML = `
                    <span>${test.title}</span>
                    <a class="test-link" onclick="startTest(${index})">Начать</a>
                `;
                testList.appendChild(testItem);
            });
        }

        // Начало теста
        function startTest(index) {
            currentTest = serverTests[index];
            currentQuestion = 0;
            score = 0;
            totalQuestions = currentTest.questions.length;
            answers = new Array(totalQuestions).fill(null); // Инициализация массива ответов
            document.querySelector('.test-list').style.display = 'none';
            document.querySelector('.test-content').style.display = 'block';
            loadQuestion();
            startTimer();
        }

        // Загрузка вопроса
        function loadQuestion() {
            const question = currentTest.questions[currentQuestion];
            const questionDiv = document.querySelector('.question');
            const questionNumberDiv = document.querySelector('.question-number');
            questionNumberDiv.textContent = `Вопрос ${currentQuestion + 1} из ${totalQuestions}`;
            questionDiv.innerHTML = '';
            if (question.text.match(/\.(jpg|png|gif)$/)) {
                const img = document.createElement('img');
                img.src = question.text;
                img.className = 'question-image';
                questionDiv.appendChild(img);
            } else {
                const p = document.createElement('p');
                p.textContent = question.text;
                questionDiv.appendChild(p);
            }
            if (question.type === 'multiple') {
                question.options.forEach((option, i) => {
                    const div = document.createElement('div');
                    div.className = 'answer-option';
                    const checked = answers[currentQuestion] === i ? 'checked' : '';
                    div.innerHTML = `<input type="radio" name="answer" value="${i}" ${checked}>${option}`;
                    questionDiv.appendChild(div);
                });
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-answer';
                input.value = answers[currentQuestion] || '';
                questionDiv.appendChild(input);
                const p = document.createElement('p');
                p.textContent = question.instruction;
                questionDiv.appendChild(p);
            }
            // Обновление кнопки "Сохранить ответ"
            const saveButton = document.getElementById('save-answer');
            if (!allowOverwriteAnswers && answers[currentQuestion] !== null) {
                saveButton.textContent = 'На вопрос уже дан ответ';
                saveButton.disabled = true;
            } else {
                saveButton.textContent = 'Сохранить ответ';
                saveButton.disabled = false;
            }
        }

        // Таймер
        function startTimer() {
            clearInterval(timer);
            const question = currentTest.questions[currentQuestion];
            const time = question.time || currentTest.time;
            if (!time) return;
            let seconds = time;
            document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
            timer = setInterval(() => {
                seconds--;
                document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    nextQuestion();
                }
            }, 1000);
        }

        // Сохранение ответа
        function saveAnswer() {
            const question = currentTest.questions[currentQuestion];
            if (question.type === 'multiple') {
                const selected = document.querySelector('input[name="answer"]:checked');
                answers[currentQuestion] = selected ? parseInt(selected.value) : null;
            } else {
                const answer = document.getElementById('text-answer').value;
                answers[currentQuestion] = answer;
            }
            nextQuestion();
        }

        // Переход к предыдущему вопросу
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
                startTimer();
            }
        }

        // Переход к следующему вопросу
        function nextQuestion() {
            if (!allowSkipQuestions && answers[currentQuestion] === null) {
                alert('Пожалуйста, ответьте на вопрос!');
                return;
            }
            currentQuestion++;
            if (currentQuestion >= totalQuestions) {
                clearInterval(timer);
                calculateScore();
                document.querySelector('.test-content').style.display = 'none';
                document.querySelector('.test-list').style.display = 'block';
                const percentage = Math.round((score / totalQuestions) * 100);
                alert(`Тест завершен! Ваш результат: ${score}/${totalQuestions} (${percentage}%)`);
                return;
            }
            loadQuestion();
            startTimer();
        }

        // Подсчет баллов
        function calculateScore() {
            score = 0;
            currentTest.questions.forEach((question, index) => {
                if (question.type === 'multiple') {
                    if (answers[index] === question.correct) {
                        score++;
                    }
                } else {
                    if (answers[index] && answers[index].toLowerCase() === question.correct.toLowerCase()) {
                        score++;
                    }
                }
            });
        }

        // Инициализация
        loadTests();
    </script>
</body>
</html>
