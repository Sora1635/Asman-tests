<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая платформа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </header>

    <div class="container">
        <div class="page active" id="home">
            <h1>Пройди увлекательные тесты!</h1>
            <p>Проверь свои знания и узнай свой результат!</p>
            <div class="home-buttons">
                <button class="action-btn" onclick="goToTests()"><i class="fas fa-play"></i> Тесты</button>
            </div>
        </div>

        <div class="page" id="take">
            <h1>Выбери тест</h1>
            <div class="test-list"></div>
            <div class="test-content" style="display: none;">
                <div class="timer"></div>
                <div class="question"></div>
                <div class="score">
                    <p>Баллы: <span id="score">0</span></p>
                    <p>Процент правильных: <span id="percentage">0%</span></p>
                </div>
                <button onclick="submitAnswer()"><i class="fas fa-check"></i> Отправить ответ</button>
                <button onclick="nextQuestion()"><i class="fas fa-arrow-right"></i> Следующий вопрос</button>
            </div>
        </div>
    </div>

    <script>
        let serverTests = [];
        let currentTest = null;
        let currentQuestion = 0;
        let timer = null;
        let score = 0;
        let totalQuestions = 0;

        // Переключение темы
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.querySelector('header').classList.toggle('dark');
            document.querySelectorAll('.card').forEach(card => card.classList.toggle('dark'));
            const toggle = document.querySelector('.theme-toggle i');
            toggle.classList.toggle('fa-moon');
            toggle.classList.toggle('fa-sun');
        }

        // Переход к тестам
        function goToTests() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('take').classList.add('active');
            loadTests();
        }

        // Загрузка тестов
        async function loadTests() {
            try {
                const response = await fetch('tests.json');
                serverTests = await response.json();
                renderTestList();
            } catch (e) {
                console.error('Ошибка загрузки тестов:', e);
            }
        }

        // Рендеринг списка тестов
        function renderTestList() {
            const testList = document.querySelector('.test-list');
            testList.innerHTML = '';
            serverTests.forEach((test, index) => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item card';
                testItem.innerHTML = `
                    <span>${test.title}</span>
                    <a class="test-link" onclick="startTest(${index})">Начать</a>
                `;
                testList.appendChild(testItem);
            });
        }

        // Начало теста
        function startTest(index) {
            currentTest = serverTests[index];
            currentQuestion = 0;
            score = 0;
            totalQuestions = currentTest.questions.length;
            document.getElementById('score').textContent = score;
            document.getElementById('percentage').textContent = '0%';
            document.querySelector('.test-list').style.display = 'none';
            document.querySelector('.test-content').style.display = 'block';
            loadQuestion();
            startTimer();
        }

        // Загрузка вопроса
        function loadQuestion() {
            const question = currentTest.questions[currentQuestion];
            const questionDiv = document.querySelector('.question');
            questionDiv.innerHTML = '';
            if (question.text.match(/\.(jpg|png|gif)$/)) {
                const img = document.createElement('img');
                img.src = question.text;
                img.className = 'question-image';
                questionDiv.appendChild(img);
            } else {
                const p = document.createElement('p');
                p.textContent = question.text;
                questionDiv.appendChild(p);
            }
            if (question.type === 'multiple') {
                question.options.forEach((option, i) => {
                    const div = document.createElement('div');
                    div.className = 'answer-option';
                    div.innerHTML = `<input type="radio" name="answer" value="${i}">${option}`;
                    questionDiv.appendChild(div);
                });
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-answer';
                questionDiv.appendChild(input);
                const p = document.createElement('p');
                p.textContent = question.instruction;
                questionDiv.appendChild(p);
            }
        }

        // Таймер
        function startTimer() {
            clearInterval(timer);
            const question = currentTest.questions[currentQuestion];
            const time = question.time || currentTest.time;
            if (!time) return;
            let seconds = time;
            document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
            timer = setInterval(() => {
                seconds--;
                document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    nextQuestion();
                }
            }, 1000);
        }

        // Отправка ответа
        function submitAnswer() {
            const question = currentTest.questions[currentQuestion];
            let correct = false;
            if (question.type === 'multiple') {
                const selected = document.querySelector('input[name="answer"]:checked');
                correct = selected && parseInt(selected.value) === question.correct;
            } else {
                const answer = document.getElementById('text-answer').value;
                correct = answer.toLowerCase() === question.correct.toLowerCase();
            }
            if (correct) {
                score++;
                document.getElementById('score').textContent = score;
                const percentage = Math.round((score / totalQuestions) * 100);
                document.getElementById('percentage').textContent = `${percentage}%`;
            }
            alert(correct ? 'Правильно!' : 'Неправильно!');
        }

        // Следующий вопрос
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= currentTest.questions.length) {
                clearInterval(timer);
                document.querySelector('.test-content').style.display = 'none';
                document.querySelector('.test-list').style.display = 'block';
                const percentage = Math.round((score / totalQuestions) * 100);
                alert(`Тест завершен! Ваш результат: ${score}/${totalQuestions} (${percentage}%)`);
                return;
            }
            loadQuestion();
            startTimer();
        }

        // Инициализация
        loadTests();
    </script>
</body>
</html>
