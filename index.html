<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая платформа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" data-page="home">Главная</a>
            <a href="#" data-page="create">Создать тест</a>
            <a href="#" data-page="take">Пройти тест</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </header>

    <div class="container">
        <div class="page active" id="home">
            <h1>Создавай и проходи тесты с удовольствием!</h1>
            <p>Погрузись в мир знаний с нашей яркой и удобной платформой!</p>
            <div class="home-buttons">
                <button class="action-btn" onclick="goToTests()"><i class="fas fa-play"></i> Тесты</button>
                <button class="action-btn create-btn" onclick="goToCreate()"><i class="fas fa-plus"></i> Создать тест</button>
            </div>
        </div>

        <div class="page" id="create">
            <h1>Создай свой тест</h1>
            <div class="card create-card">
                <input type="text" id="test-title" placeholder="Название теста" required>
                <input type="number" id="test-time" placeholder="Общее время (сек, опционально)">
                <h3>Добавить вопрос</h3>
                <textarea id="question-text" placeholder="Текст вопроса или URL изображения" required></textarea>
                <select id="question-type">
                    <option value="multiple">Выбор ответа</option>
                    <option value="text">Ввод текста</option>
                </select>
                <div id="multiple-options" style="display: none;">
                    <input type="text" class="option" placeholder="Вариант 1" required>
                    <input type="text" class="option" placeholder="Вариант 2" required>
                    <input type="text" class="option" placeholder="Вариант 3" required>
                    <input type="text" class="option" placeholder="Вариант 4" required>
                    <input type="number" id="correct-option" placeholder="Номер правильного ответа (1-4)" min="1" max="4" required>
                </div>
                <div id="text-answer" style="display: none;">
                    <input type="text" id="correct-text" placeholder="Правильный ответ" required>
                    <input type="text" id="answer-instruction" placeholder="Инструкция для ответа">
                </div>
                <input type="number" id="question-time" placeholder="Время на вопрос (сек, опционально)">
                <button class="add-question-btn" onclick="addQuestion()"><i class="fas fa-plus"></i> Добавить вопрос</button>
                <div id="question-list"></div>
                <button class="save-test-btn" onclick="saveTest()"><i class="fas fa-save"></i> Сохранить тест</button>
            </div>
        </div>

        <div class="page" id="take">
            <h1>Пройти тест</h1>
            <div class="test-list"></div>
            <div class="test-content" style="display: none;">
                <div class="timer"></div>
                <div class="question"></div>
                <button onclick="submitAnswer()"><i class="fas fa-check"></i> Отправить ответ</button>
                <button onclick="nextQuestion()"><i class="fas fa-arrow-right"></i> Следующий вопрос</button>
            </div>
        </div>
    </div>

    <script>
        let serverTests = [];
        let currentTest = { questions: [] };
        let currentQuestion = 0;
        let timer = null;

        // Переключение страниц
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(link.dataset.page).classList.add('active');
                if (link.dataset.page === 'take') loadTests();
            });
        });

        // Переключение темы
        function toggleTheme() {
            document.body.classList.toggle('dark');
            document.querySelector('header').classList.toggle('dark');
            document.querySelectorAll('.card').forEach(card => card.classList.toggle('dark'));
            const toggle = document.querySelector('.theme-toggle i');
            toggle.classList.toggle('fa-moon');
            toggle.classList.toggle('fa-sun');
        }

        // Навигация с главной страницы
        function goToTests() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('take').classList.add('active');
            loadTests();
        }

        function goToCreate() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('create').classList.add('active');
        }

        // Загрузка тестов
        async function loadTests() {
            try {
                const response = await fetch('tests.json');
                serverTests = await response.json();
                renderTestList();
            } catch (e) {
                console.error('Ошибка загрузки тестов:', e);
            }
        }

        // Рендеринг списка тестов
        function renderTestList() {
            const testList = document.querySelector('.test-list');
            testList.innerHTML = '';
            serverTests.forEach((test, index) => {
                const testItem = document.createElement('div');
                testItem.className = 'test-item card';
                testItem.innerHTML = `
                    <span>${test.title}</span>
                    <span>
                        <a class="test-link" onclick="startTest(${index})">Начать</a>
                        <a class="test-link" onclick="copyTestLink(${index})">Копировать ссылку</a>
                    </span>
                `;
                testList.appendChild(testItem);
            });
        }

        // Добавление вопроса
        function addQuestion() {
            const question = {
                text: document.getElementById('question-text').value || 'Без текста',
                type: document.getElementById('question-type').value,
                time: parseInt(document.getElementById('question-time').value) || null
            };
            if (question.type === 'multiple') {
                question.options = Array.from(document.querySelectorAll('.option')).map(opt => opt.value || 'Пустой вариант');
                question.correct = parseInt(document.getElementById('correct-option').value) - 1 || 0;
            } else {
                question.correct = document.getElementById('correct-text').value || 'Без ответа';
                question.instruction = document.getElementById('answer-instruction').value || 'Без инструкции';
            }
            currentTest.questions.push(question);
            renderQuestions();
            clearQuestionForm();
        }

        // Очистка формы вопроса
        function clearQuestionForm() {
            document.getElementById('question-text').value = '';
            document.getElementById('question-time').value = '';
            document.querySelectorAll('.option').forEach(opt => opt.value = '');
            document.getElementById('correct-option').value = '';
            document.getElementById('correct-text').value = '';
            document.getElementById('answer-instruction').value = '';
        }

        // Рендеринг списка вопросов
        function renderQuestions() {
            const questionList = document.getElementById('question-list');
            questionList.innerHTML = '';
            currentTest.questions.forEach((question, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.className = 'question-block';
                questionBlock.innerHTML = `
                    <p><strong>Вопрос ${index + 1}:</strong> ${question.text}</p>
                    <p><strong>Тип:</strong> ${question.type === 'multiple' ? 'Выбор ответа' : 'Ввод текста'}</p>
                    ${question.time ? `<p><strong>Время:</strong> ${question.time} сек</p>` : ''}
                    ${question.type === 'multiple' ? `<p><strong>Варианты:</strong> ${question.options.join(', ')}</p><p><strong>Правильный:</strong> ${question.options[question.correct]}</p>` : ''}
                    ${question.type === 'text' ? `<p><strong>Правильный ответ:</strong> ${question.correct}</p><p><strong>Инструкция:</strong> ${question.instruction}</p>` : ''}
                    <button class="delete-btn" onclick="deleteQuestion(${index})"><i class="fas fa-trash"></i> Удалить</button>
                `;
                questionList.appendChild(questionBlock);
            });
        }

        // Удаление вопроса
        function deleteQuestion(index) {
            currentTest.questions.splice(index, 1);
            renderQuestions();
        }

        // Сохранение теста
        async function saveTest() {
            const test = {
                title: document.getElementById('test-title').value || 'Без названия',
                time: parseInt(document.getElementById('test-time').value) || null,
                questions: currentTest.questions
            };
            if (!test.title || test.questions.length === 0) {
                alert('Введите название теста и добавьте хотя бы один вопрос!');
                return;
            }
            serverTests.push(test);
            try {
                // Симуляция сохранения на сервер (в реальном проекте нужен API)
                await fetch('tests.json', {
                    method: 'PUT', // В реальном проекте используйте POST или API
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(serverTests)
                });
                alert('Тест успешно сохранен!');
                document.getElementById('test-title').value = '';
                document.getElementById('test-time').value = '';
                currentTest = { questions: [] };
                renderQuestions();
                renderTestList();
            } catch (e) {
                console.error('Ошибка сохранения теста:', e);
                alert('Ошибка при сохранении теста!');
            }
        }

        // Тип вопроса
        document.getElementById('question-type').addEventListener('change', (e) => {
            document.getElementById('multiple-options').style.display = e.target.value === 'multiple' ? 'block' : 'none';
            document.getElementById('text-answer').style.display = e.target.value === 'text' ? 'block' : 'none';
        });

        // Начало теста
        function startTest(index) {
            currentTest = serverTests[index];
            currentQuestion = 0;
            document.querySelector('.test-list').style.display = 'none';
            document.querySelector('.test-content').style.display = 'block';
            loadQuestion();
            startTimer();
        }

        // Загрузка вопроса
        function loadQuestion() {
            const question = currentTest.questions[currentQuestion];
            const questionDiv = document.querySelector('.question');
            questionDiv.innerHTML = '';
            if (question.text.match(/\.(jpg|png|gif)$/)) {
                const img = document.createElement('img');
                img.src = question.text;
                img.className = 'question-image';
                questionDiv.appendChild(img);
            } else {
                const p = document.createElement('p');
                p.textContent = question.text;
                questionDiv.appendChild(p);
            }
            if (question.type === 'multiple') {
                question.options.forEach((option, i) => {
                    const div = document.createElement('div');
                    div.className = 'answer-option';
                    div.innerHTML = `<input type="radio" name="answer" value="${i}">${option}`;
                    questionDiv.appendChild(div);
                });
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-answer';
                questionDiv.appendChild(input);
                const p = document.createElement('p');
                p.textContent = question.instruction;
                questionDiv.appendChild(p);
            }
        }

        // Таймер
        function startTimer() {
            clearInterval(timer);
            const question = currentTest.questions[currentQuestion];
            const time = question.time || currentTest.time;
            if (!time) return;
            let seconds = time;
            document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
            timer = setInterval(() => {
                seconds--;
                document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    nextQuestion();
                }
            }, 1000);
        }

        // Отправка ответа
        function submitAnswer() {
            const question = currentTest.questions[currentQuestion];
            let correct = false;
            if (question.type === 'multiple') {
                const selected = document.querySelector('input[name="answer"]:checked');
                correct = selected && parseInt(selected.value) === question.correct;
            } else {
                const answer = document.getElementById('text-answer').value;
                correct = answer.toLowerCase() === question.correct.toLowerCase();
            }
            alert(correct ? 'Правильно!' : 'Неправильно!');
        }

        // Следующий вопрос
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= currentTest.questions.length) {
                clearInterval(timer);
                document.querySelector('.test-content').style.display = 'none';
                document.querySelector('.test-list').style.display = 'block';
                alert('Тест завершен!');
                return;
            }
            loadQuestion();
            startTimer();
        }

        // Копирование ссылки
        function copyTestLink(index) {
            const url = `${window.location.origin}/?test=${index}`;
            navigator.clipboard.writeText(url).then(() => alert('Ссылка скопирована!'));
        }

        // Инициализация
        loadTests();
    </script>
</body>
</html>
