<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая платформа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" data-page="home" aria-label="Перейти на главную страницу">Главная</a>
            <a href="#" data-page="create" aria-label="Создать новый тест">Создать тест</a>
            <a href="#" data-page="take" aria-label="Пройти тест">Пройти тест</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Переключить тему"><i class="fas fa-moon"></i></button>
    </header>

    <div class="container">
        <div class="page active" id="home">
            <h1>Тестовая платформа нового поколения</h1>
            <p>Создавайте интерактивные тесты, проходите их с удовольствием и анализируйте результаты!</p>
        </div>

        <div class="page" id="create">
            <h1>Создать тест</h1>
            <div class="card">
                <input type="text" id="test-title" placeholder="Название теста" aria-label="Название теста" required>
                <input type="number" id="test-time" placeholder="Общее время (сек, опционально)" aria-label="Общее время теста">
                <h3>Добавить вопрос</h3>
                <select id="question-type" aria-label="Тип вопроса">
                    <option value="multiple">Выбор ответа</option>
                    <option value="text">Ввод текста</option>
                    <option value="drag">Drag-and-Drop</option>
                    <option value="match">Сопоставление</option>
                </select>
                <textarea id="question-text" placeholder="Текст вопроса или URL изображения" aria-label="Текст вопроса"></textarea>
                <div id="multiple-options" class="question-options" style="display: none;">
                    <input type="text" class="option" placeholder="Вариант 1" aria-label="Вариант ответа 1">
                    <input type="text" class="option" placeholder="Вариант 2" aria-label="Вариант ответа 2">
                    <input type="text" class="option" placeholder="Вариант 3" aria-label="Вариант ответа 3">
                    <input type="text" class="option" placeholder="Вариант 4" aria-label="Вариант ответа 4">
                    <input type="number" id="correct-option" placeholder="Номер правильного ответа (1-4)" aria-label="Номер правильного ответа">
                </div>
                <div id="text-answer" class="question-options" style="display: none;">
                    <input type="text" id="correct-text" placeholder="Правильный ответ" aria-label="Правильный ответ">
                    <input type="text" id="answer-instruction" placeholder="Инструкция для ответа" aria-label="Инструкция для ответа">
                </div>
                <div id="drag-options" class="question-options" style="display: none;">
                    <input type="text" id="drag-items" placeholder="Элементы (через запятую)" aria-label="Элементы для drag-and-drop">
                    <input type="text" id="drag-correct" placeholder="Правильный порядок (через запятую)" aria-label="Правильный порядок">
                </div>
                <div id="match-options" class="question-options" style="display: none;">
                    <input type="text" id="match-pairs" placeholder="Пары (формат: ключ:значение, через запятую)" aria-label="Пары для сопоставления">
                </div>
                <input type="number" id="question-time" placeholder="Время на вопрос (сек, опционально)" aria-label="Время на вопрос">
                <button onclick="addQuestion()"><i class="fas fa-plus"></i> Добавить вопрос</button>
                <div id="question-list"></div>
                <button onclick="previewTest()"><i class="fas fa-eye"></i> Предпросмотр</button>
                <button onclick="saveTest()"><i class="fas fa-save"></i> Сохранить тест</button>
            </div>
        </div>

        <div class="page" id="take">
            <h1>Пройти тест</h1>
            <div class="test-list"></div>
            <div class="test-content" style="display: none;">
                <div class="timer"></div>
                <div class="question"></div>
                <button onclick="submitAnswer()"><i class="fas fa-check"></i> Отправить ответ</button>
                <button onclick="nextQuestion()"><i class="fas fa-arrow-right"></i> Следующий вопрос</button>
                <button onclick="exportResults()"><i class="fas fa-download"></i> Экспорт результатов</button>
            </div>
        </div>
    </div>

    <script>
        let serverTests = [];
        // let userTests = []; // Закомментировано: пользовательские тесты
        let currentTest = { questions: [] };
        let currentQuestion = 0;
        let timer = null;
        let results = { correct: 0, total: 0, timeSpent: 0 };

        // Переключение страниц
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Переключение на страницу:', link.dataset.page);
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(link.dataset.page).classList.add('active');
                if (link.dataset.page === 'take') loadTests();
            });
        });

        // Переключение темы
        function toggleTheme() {
            console.log('Переключение темы');
            document.body.classList.toggle('dark');
            document.querySelector('header').classList.toggle('dark');
            document.querySelectorAll('.card').forEach(card => card.classList.toggle('dark'));
            const toggle = document.querySelector('.theme-toggle i');
            toggle.classList.toggle('fa-moon');
            toggle.classList.toggle('fa-sun');
        }

        // Загрузка серверных тестов
        async function loadTests() {
            try {
                console.log('Загрузка тестов из tests.json');
                const response = await fetch('tests.json');
                if (!response.ok) throw new Error('Не удалось загрузить тесты');
                serverTests = await response.json();
                const testList = document.querySelector('.test-list');
                testList.innerHTML = '';
                serverTests.forEach((test, index) => {
                    const testItem = document.createElement('div');
                    testItem.className = 'test-item card';
                    testItem.innerHTML = `
                        <span>${test.title}</span>
                        <span>
                            <a class="test-link" onclick="startTest(${index})" aria-label="Начать тест ${test.title}">Начать</a>
                            <a class="test-link" onclick="copyTestLink(${index})" aria-label="Копировать ссылку на тест">Копировать ссылку</a>
                        </span>
                    `;
                    testList.appendChild(testItem);
                });
            } catch (e) {
                console.error('Ошибка загрузки тестов:', e);
                alert('Не удалось загрузить тесты. Проверьте tests.json.');
            }
        }

        // Смена типа вопроса
        document.getElementById('question-type').addEventListener('change', (e) => {
            console.log('Смена типа вопроса:', e.target.value);
            document.querySelectorAll('.question-options').forEach(opt => opt.style.display = 'none');
            document.getElementById(`${e.target.value}-options`).style.display = 'block';
        });

        // Валидация формы вопроса
        function validateQuestion() {
            const type = document.getElementById('question-type').value;
            const text = document.getElementById('question-text').value.trim();
            if (!text) {
                alert('Введите текст вопроса или URL изображения');
                return false;
            }
            if (type === 'multiple') {
                const options = Array.from(document.querySelectorAll('.option')).map(opt => opt.value.trim());
                const correct = parseInt(document.getElementById('correct-option').value);
                if (options.some(opt => !opt) || !correct || correct < 1 || correct > 4) {
                    alert('Заполните все варианты ответа и выберите правильный (1-4)');
                    return false;
                }
            } else if (type === 'text') {
                const correct = document.getElementById('correct-text').value.trim();
                if (!correct) {
                    alert('Введите правильный ответ');
                    return false;
                }
            } else if (type === 'drag') {
                const items = document.getElementById('drag-items').value.trim();
                const correct = document.getElementById('drag-correct').value.trim();
                if (!items || !correct) {
                    alert('Введите элементы и правильный порядок');
                    return false;
                }
            } else if (type === 'match') {
                const pairs = document.getElementById('match-pairs').value.trim();
                if (!pairs) {
                    alert('Введите пары для сопоставления');
                    return false;
                }
            }
            return true;
        }

        // Добавление вопроса
        function addQuestion() {
            console.log('Добавление вопроса');
            if (!validateQuestion()) return;
            const question = {
                text: document.getElementById('question-text').value.trim(),
                type: document.getElementById('question-type').value,
                time: parseInt(document.getElementById('question-time').value) || null
            };
            if (question.type === 'multiple') {
                question.options = Array.from(document.querySelectorAll('.option')).map(opt => opt.value.trim());
                question.correct = parseInt(document.getElementById('correct-option').value) - 1;
            } else if (question.type === 'text') {
                question.correct = document.getElementById('correct-text').value.trim();
                question.instruction = document.getElementById('answer-instruction').value.trim() || 'Введите ответ';
            } else if (question.type === 'drag') {
                question.items = document.getElementById('drag-items').value.split(',').map(item => item.trim());
                question.correct = document.getElementById('drag-correct').value.split(',').map(item => item.trim());
            } else if (question.type === 'match') {
                question.pairs = document.getElementById('match-pairs').value.split(',').map(pair => {
                    const [key, value] = pair.split(':').map(item => item.trim());
                    return { key, value };
                });
                question.correct = question.pairs.map(p => p.key);
            }
            currentTest.questions.push(question);
            renderQuestions();
            clearQuestionForm();
        }

        // Очистка формы вопроса
        function clearQuestionForm() {
            console.log('Очистка формы вопроса');
            document.getElementById('question-text').value = '';
            document.getElementById('question-time').value = '';
            document.querySelectorAll('.option').forEach(opt => opt.value = '');
            document.getElementById('correct-option').value = '';
            document.getElementById('correct-text').value = '';
            document.getElementById('answer-instruction').value = '';
            document.getElementById('drag-items').value = '';
            document.getElementById('drag-correct').value = '';
            document.getElementById('match-pairs').value = '';
        }

        // Рендеринг списка вопросов
        function renderQuestions() {
            console.log('Рендеринг вопросов:', currentTest.questions);
            const questionList = document.getElementById('question-list');
            questionList.innerHTML = '';
            currentTest.questions.forEach((question, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.className = 'question-block';
                questionBlock.innerHTML = `
                    <p><strong>Вопрос ${index + 1}:</strong> ${question.text}</p>
                    <p><strong>Тип:</strong> ${question.type === 'multiple' ? 'Выбор ответа' : question.type === 'text' ? 'Ввод текста' : question.type === 'drag' ? 'Drag-and-Drop' : 'Сопоставление'}</p>
                    ${question.time ? `<p><strong>Время:</strong> ${question.time} сек</p>` : ''}
                    ${question.type === 'multiple' ? `<p><strong>Варианты:</strong> ${question.options.join(', ')}</p><p><strong>Правильный:</strong> ${question.options[question.correct]}</p>` : ''}
                    ${question.type === 'text' ? `<p><strong>Правильный ответ:</strong> ${question.correct}</p><p><strong>Инструкция:</strong> ${question.instruction}</p>` : ''}
                    ${question.type === 'drag' ? `<p><strong>Элементы:</strong> ${question.items.join(', ')}</p><p><strong>Правильный порядок:</strong> ${question.correct.join(', ')}</p>` : ''}
                    ${question.type === 'match' ? `<p><strong>Пары:</strong> ${question.pairs.map(p => `${p.key}: ${p.value}`).join(', ')}</p>` : ''}
                    <button class="delete-btn" onclick="deleteQuestion(${index})" aria-label="Удалить вопрос ${index + 1}"><i class="fas fa-trash"></i> Удалить</button>
                `;
                questionList.appendChild(questionBlock);
            });
        }

        // Удаление вопроса
        function deleteQuestion(index) {
            console.log('Удаление вопроса:', index);
            currentTest.questions.splice(index, 1);
            renderQuestions();
        }

        // Предпросмотр теста
        function previewTest() {
            console.log('Предпросмотр теста');
            if (!currentTest.questions.length) {
                alert('Добавьте хотя бы один вопрос');
                return;
            }
            alert('Предпросмотр: ' + JSON.stringify(currentTest, null, 2));
        }

        // Сохранение теста (закомментировано для пользовательских тестов)
        /*
        function saveTest() {
            console.log('Сохранение теста');
            if (!document.getElementById('test-title').value.trim()) {
                alert('Введите название теста');
                return;
            }
            const test = {
                title: document.getElementById('test-title').value.trim(),
                time: parseInt(document.getElementById('test-time').value) || null,
                questions: currentTest.questions
            };
            userTests.push(test);
            alert('Тест сохранен!');
            document.getElementById('test-title').value = '';
            document.getElementById('test-time').value = '';
            currentTest = { questions: [] };
            renderQuestions();
        }
        */

        // Начало теста
        function startTest(index) {
            console.log('Начало теста:', index);
            currentTest = serverTests[index];
            currentQuestion = 0;
            results = { correct: 0, total: 0, timeSpent: 0 };
            document.querySelector('.test-list').style.display = 'none';
            document.querySelector('.test-content').style.display = 'block';
            loadQuestion();
            startTimer();
        }

        // Загрузка вопроса
        function loadQuestion() {
            console.log('Загрузка вопроса:', currentQuestion);
            const question = currentTest.questions[currentQuestion];
            const questionDiv = document.querySelector('.question');
            questionDiv.innerHTML = '';
            if (question.text.match(/\.(jpg|png|gif)$/)) {
                const img = document.createElement('img');
                img.src = question.text;
                img.className = 'question-image';
                img.alt = 'Изображение вопроса';
                questionDiv.appendChild(img);
            } else {
                const p = document.createElement('p');
                p.textContent = question.text;
                questionDiv.appendChild(p);
            }
            if (question.type === 'multiple') {
                question.options.forEach((option, i) => {
                    const div = document.createElement('div');
                    div.className = 'answer-option';
                    div.innerHTML = `<input type="radio" name="answer" value="${i}" id="option-${i}" aria-label="Вариант ответа ${option}"><label for="option-${i}">${option}</label>`;
                    questionDiv.appendChild(div);
                });
            } else if (question.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'text-answer';
                input.placeholder = question.instruction;
                input.ariaLabel = 'Поле для ввода ответа';
                questionDiv.appendChild(input);
                const p = document.createElement('p');
                p.textContent = question.instruction;
                questionDiv.appendChild(p);
            } else if (question.type === 'drag') {
                const dragContainer = document.createElement('div');
                dragContainer.className = 'drag-container';
                question.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'drag-item';
                    div.draggable = true;
                    div.textContent = item;
                    div.dataset.value = item;
                    dragContainer.appendChild(div);
                });
                questionDiv.appendChild(dragContainer);
                addDragEvents(dragContainer);
            } else if (question.type === 'match') {
                const matchContainer = document.createElement('div');
                matchContainer.className = 'match-container';
                const shuffledKeys = shuffleArray([...question.pairs.map(p => p.key)]);
                const shuffledValues = shuffleArray([...question.pairs.map(p => p.value)]);
                shuffledKeys.forEach(key => {
                    const div = document.createElement('div');
                    div.className = 'match-pair';
                    div.innerHTML = `
                        <span>${key}</span>
                        <select class="match-select" data-key="${key}" aria-label="Выберите соответствие для ${key}">
                            <option value="">Выберите...</option>
                            ${shuffledValues.map(val => `<option value="${val}">${val}</option>`).join('')}
                        </select>
                    `;
                    matchContainer.appendChild(div);
                });
                questionDiv.appendChild(matchContainer);
            }
        }

        // Drag-and-Drop события
        function addDragEvents(container) {
            const items = container.querySelectorAll('.drag-item');
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.value);
                    e.target.classList.add('dragging');
                });
                item.addEventListener('dragend', (e) => {
                    e.target.classList.remove('dragging');
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedValue = e.dataTransfer.getData('text/plain');
                    const draggedItem = container.querySelector(`[data-value="${draggedValue}"]`);
                    const targetItem = e.target.closest('.drag-item');
                    if (draggedItem && targetItem) {
                        const draggedIndex = Array.from(container.children).indexOf(draggedItem);
                        const targetIndex = Array.from(container.children).indexOf(targetItem);
                        if (draggedIndex < targetIndex) {
                            container.insertBefore(draggedItem, targetItem.nextSibling);
                        } else {
                            container.insertBefore(draggedItem, targetItem);
                        }
                    }
                });
            });
        }

        // Перемешивание массива
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Таймер
        function startTimer() {
            console.log('Запуск таймера');
            clearInterval(timer);
            const question = currentTest.questions[currentQuestion];
            const time = question.time || currentTest.time;
            if (!time) {
                document.querySelector('.timer').textContent = '';
                return;
            }
            let seconds = time;
            document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
            timer = setInterval(() => {
                seconds--;
                results.timeSpent++;
                document.querySelector('.timer').textContent = `Осталось: ${seconds} сек`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    nextQuestion();
                }
            }, 1000);
        }

        // Отправка ответа
        function submitAnswer() {
            console.log('Отправка ответа');
            const question = currentTest.questions[currentQuestion];
            let correct = false;
            results.total++;
            if (question.type === 'multiple') {
                const selected = document.querySelector('input[name="answer"]:checked');
                correct = selected && parseInt(selected.value) === question.correct;
            } else if (question.type === 'text') {
                const answer = document.getElementById('text-answer').value.trim();
                correct = answer.toLowerCase() === question.correct.toLowerCase();
            } else if (question.type === 'drag') {
                const items = Array.from(document.querySelectorAll('.drag-item')).map(item => item.dataset.value);
                correct = items.join(',') === question.correct.join(',');
            } else if (question.type === 'match') {
                const selects = document.querySelectorAll('.match-select');
                correct = Array.from(selects).every(select => {
                    const key = select.dataset.key;
                    const value = select.value;
                    const pair = question.pairs.find(p => p.key === key);
                    return pair && pair.value === value;
                });
            }
            if (correct) results.correct++;
            alert(correct ? 'Правильно!' : 'Неправильно!');
        }

        // Следующий вопрос
        function nextQuestion() {
            console.log('Переход к следующему вопросу');
            currentQuestion++;
            if (currentQuestion >= currentTest.questions.length) {
                clearInterval(timer);
                document.querySelector('.test-content').style.display = 'none';
                document.querySelector('.test-list').style.display = 'block';
                alert(`Тест завершен! Правильных ответов: ${results.correct}/${results.total}`);
                return;
            }
            loadQuestion();
            startTimer();
        }

        // Копирование ссылки
        function copyTestLink(index) {
            console.log('Копирование ссылки:', index);
            const url = `${window.location.origin}/?test=${index}`;
            navigator.clipboard.writeText(url).then(() => alert('Ссылка скопирована!'));
        }

        // Экспорт результатов
        function exportResults() {
            console.log('Экспорт результатов');
            const resultData = {
                testTitle: currentTest.title,
                correctAnswers: results.correct,
                totalQuestions: results.total,
                timeSpent: results.timeSpent,
                date: new Date().toISOString()
            };
            const json = JSON.stringify(resultData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `results_${currentTest.title}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Инициализация
        console.log('Инициализация приложения');
        loadTests();
    </script>
</body>
</html>
